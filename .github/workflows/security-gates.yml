name: Security Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Bandit (high severity only)
        run: |
          bandit -q -r backend -lll

      - name: pip-audit (fail on known vulns)
        run: |
          pip-audit -r requirements.txt

      - name: Backup/restore drill smoke
        env:
          BACKUP_DRILL_SIGNING_KEY: ${{ secrets.BACKUP_DRILL_SIGNING_KEY }}
          BACKUP_DRILL_SIGNING_KID: ci-security-gate
          BACKUP_DRILL_RETENTION_DAYS: 30
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          p = pathlib.Path('backend/data/geolog.db')
          p.parent.mkdir(parents=True, exist_ok=True)
          conn = sqlite3.connect(p)
          cur = conn.cursor()
          cur.execute('CREATE TABLE IF NOT EXISTS drill_sample (id INTEGER PRIMARY KEY, v TEXT)')
          cur.execute('INSERT INTO drill_sample(v) VALUES (?)', ('ok',))
          conn.commit()
          conn.close()
          PY
          bash scripts/backup_restore_drill.sh backend/data/geolog.db

      - name: Attest backup evidence via API contract
        env:
          BACKUP_DRILL_SIGNING_KEY: ${{ secrets.BACKUP_DRILL_SIGNING_KEY }}
          GEOLOG_ENV: dev
          AUDIT_EXPORT_HMAC_KEY: ${{ secrets.BACKUP_DRILL_SIGNING_KEY }}
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 >/tmp/geolog-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=1.5) as r:
                      if int(getattr(r, 'status', 0) or 0) == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.5)
          raise SystemExit('api not ready')
          PY
          python scripts/security_evidence_attest.py --base-url http://127.0.0.1:8000 --artifact-dir artifacts/backup-drill
          python - <<'PY'
          import json, urllib.request
          req = urllib.request.Request('http://127.0.0.1:8000/api/ops/security-evidence/manifest?sign=true', headers={'X-User-Role':'viewer'})
          with urllib.request.urlopen(req, timeout=10) as r:
              data = json.loads(r.read().decode('utf-8'))
          assert data.get('ok') is True, data
          assert data.get('signature_alg') == 'hmac-sha256', data
          assert isinstance(data.get('signature'), str) and len(data['signature']) == 64, data
          print('manifest gate passed')
          PY

      - name: Upload backup-drill evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-drill-evidence
          path: artifacts/backup-drill/**
          retention-days: 30

      - name: Secret token grep gate
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          deny = [
              re.compile(r'AKIA[0-9A-Z]{16}'),
              re.compile(r'-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----'),
              re.compile(r'(?i)aws_secret_access_key\s*=\s*["\'][^"\']+["\']'),
          ]
          skip_dirs = {'.git', 'node_modules', '.venv', 'venv', '__pycache__'}
          bad = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              if any(part in skip_dirs for part in p.parts):
                  continue
              if p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.ico','.pdf','.zip','.db','.sqlite','.woff','.woff2'}:
                  continue
              try:
                  txt = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              for rx in deny:
                  if rx.search(txt):
                      bad.append(str(p))
                      break
          if bad:
              print('Potential hardcoded secrets found:')
              for b in sorted(set(bad)):
                  print('-', b)
              sys.exit(1)
          print('Secret token grep gate passed')
          PY
