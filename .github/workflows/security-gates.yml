name: security-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit high-severity gate
        run: bandit -q -r backend -lll

      - name: Dependency vulnerability gate
        run: pip-audit -r requirements.txt

      - name: Hardcoded secret regex gate
        run: |
          set -euo pipefail
          if git grep -nE '(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':(exclude)artifacts/**' ; then
            echo "hardcoded secret pattern detected"
            exit 1
          fi
          echo "secret regex gate passed"

  container-and-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  backup-evidence-gate:
    runs-on: ubuntu-latest
    env:
      BACKUP_DRILL_SIGNING_KEY: ci-backup-drill-key
      BACKUP_DRILL_SIGNING_KID: backup-drill
      BACKUP_DRILL_RETENTION_DAYS: "30"
      AUDIT_EXPORT_SIGNING_KEY: ci-audit-signing-key
      AUDIT_EXPORT_SIGNING_KID: ci-audit-signing-kid
      GEOLOG_ENV: ci
      GEOLOG_ENFORCE_SECRETS_SOURCE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backup/restore drill smoke
        run: |
          set -euo pipefail
          bash scripts/backup_restore_drill.sh backend/geolog.db

      - name: Start API server
        run: |
          set -euo pipefail
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/geolog-api.log 2>&1 &
          echo $! > /tmp/geolog-api.pid
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/docs >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat /tmp/geolog-api.log || true
          exit 1

      - name: API attestation gate
        run: python scripts/security_evidence_attest.py --base-url http://127.0.0.1:8000 --artifact-dir artifacts/backup-drill

      - name: Signed manifest gate
        run: |
          curl -sf "http://127.0.0.1:8000/api/ops/security-evidence/manifest?sign=true" > /tmp/manifest.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/manifest.json', 'r', encoding='utf-8'))
          assert p.get('signature'), 'missing signature'
          assert p.get('signature_alg') == 'hmac-sha256', 'unexpected signature alg'
          assert p.get('signature_kid'), 'missing signature_kid'
          print('manifest signature ok')
          PY

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/geolog-api.pid ]; then
            kill "$(cat /tmp/geolog-api.pid)" || true
          fi
          cat /tmp/geolog-api.log || true
