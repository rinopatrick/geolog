name: quality-gate
on: [push, pull_request]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      GEOLOG_ENV: ci
      GEOLOG_ENFORCE_SECRETS_SOURCE: "false"
      GEOLOG_ENABLE_DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

      - name: Start API
        run: |
          set -euo pipefail
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in {1..40}; do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat /tmp/api.log || true
          exit 1

      - run: python scripts/regression_harness.py
      - run: python scripts/rbac_gate.py

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then kill "$(cat /tmp/api.pid)" || true; fi
          cat /tmp/api.log || true
