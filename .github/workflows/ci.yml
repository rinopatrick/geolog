name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax gates
        run: |
          python -m py_compile backend/main.py backend/routers/templates.py backend/security.py

      - name: Test gates
        run: |
          python -m pytest tests/ -q

      - name: Frontend syntax gates
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/log-renderer.js
