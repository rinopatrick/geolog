name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Python syntax gates
        run: python -m compileall -q backend tests scripts

      - name: Test and coverage gates
        run: bash scripts/coverage_gate.sh

      # Fails when a model changed without a matching migration. This is what
      # stops two people from colliding on the schema: the second one to push
      # gets a red build instead of a database that silently lacks their column.
      - name: Migration gates
        env:
          GEOLOG_ENV: ci
          GEOLOG_DB_PATH: ${{ runner.temp }}/migration-gate.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Frontend syntax gates
        run: |
          for f in frontend/js/*.js scripts/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEOLOG_ENV: ci
      GEOLOG_ENFORCE_SECRETS_SOURCE: "false"
      GEOLOG_ENABLE_DEMO_SEED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start API
        run: |
          set -euo pipefail
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/geolog-browser.log 2>&1 &
          echo $! > /tmp/geolog-browser.pid
          for i in {1..40}; do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat /tmp/geolog-browser.log || true
          exit 1

      - name: Browser smoke
        run: npm run e2e

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/geolog-browser.pid ]; then
            kill "$(cat /tmp/geolog-browser.pid)" || true
          fi
          cat /tmp/geolog-browser.log || true
