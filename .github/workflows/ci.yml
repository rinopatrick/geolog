name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Python syntax gates
        run: python -m compileall -q backend tests scripts

      - name: Test gates
        run: python -m pytest tests/ -q

      - name: Frontend syntax gates
        run: |
          for f in frontend/js/*.js scripts/*.js; do
            echo "checking $f"
            node --check "$f"
          done
