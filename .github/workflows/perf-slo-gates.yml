name: perf-slo-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slo-load-gate:
    runs-on: ubuntu-latest
    env:
      GEOLOG_ENV: ci
      GEOLOG_ENFORCE_SECRETS_SOURCE: "false"
      OPS_SLO_AVG_MS: "500"
      OPS_SLO_P95_MS: "800"
      OPS_SLO_ERROR_RATE: "0.01"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API server
        run: |
          set -euo pipefail
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/geolog-api.log 2>&1 &
          echo $! > /tmp/geolog-api.pid
          for i in {1..40}; do
            if curl -sf http://127.0.0.1:8000/docs >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat /tmp/geolog-api.log || true
          exit 1

      - name: Run Phase-3 SLO load gate
        run: |
          python scripts/slo_load_gate.py \
            --base-url http://127.0.0.1:8000 \
            --requests 150 \
            --concurrency 15 \
            --avg-max-ms 500 \
            --p95-max-ms 800 \
            --error-rate-max 0.01

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/geolog-api.pid ]; then
            kill "$(cat /tmp/geolog-api.pid)" || true
          fi
          cat /tmp/geolog-api.log || true
