name: postgres-multi-instance

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: borelia
          POSTGRES_PASSWORD: borelia
          POSTGRES_DB: borelia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borelia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BORELIA_ENV: ci
      BORELIA_ENFORCE_SECRETS_SOURCE: "false"
      BORELIA_ENABLE_DEMO_SEED: "false"
      BORELIA_DATABASE_URL: postgresql+psycopg://borelia:borelia@127.0.0.1:5432/borelia
      BORELIA_STATE_BACKEND: database
      AUTH_MODE: jwt
      AUTH_JWT_SECRET: multi-instance-secret-0123456789-abcdef
      AUTH_JWT_ALGORITHMS: HS256
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrate PostgreSQL
        run: python -m alembic upgrade head

      - name: Seed demo data once
        run: |
          python - <<'PY'
          from backend.database import SessionLocal
          from backend.main import seed_demo_data
          db = SessionLocal()
          try:
              print("seeded", seed_demo_data(db))
          finally:
              db.close()
          PY

      - name: Start two instances
        run: |
          set -euo pipefail
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 \
            > /tmp/borelia-a.log 2>&1 &
          echo $! > /tmp/borelia-a.pid
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8002 \
            > /tmp/borelia-b.log 2>&1 &
          echo $! > /tmp/borelia-b.pid
          for port in 8001 8002; do
            for i in {1..60}; do
              if curl -sf "http://127.0.0.1:${port}/api/health" >/dev/null; then
                echo "instance ${port} ready"
                break
              fi
              sleep 1
              if [ "$i" = "60" ]; then
                echo "instance ${port} failed to start"
                cat /tmp/borelia-a.log /tmp/borelia-b.log || true
                exit 1
              fi
            done
          done

      - name: Probe shared state
        run: python scripts/multi_instance_probe.py

      - name: Stop instances and show logs
        if: always()
        run: |
          for pidfile in /tmp/borelia-a.pid /tmp/borelia-b.pid; do
            if [ -f "$pidfile" ]; then kill "$(cat "$pidfile")" || true; fi
          done
          echo '--- instance A ---'
          cat /tmp/borelia-a.log || true
          echo '--- instance B ---'
          cat /tmp/borelia-b.log || true
