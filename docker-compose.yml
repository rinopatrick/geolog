services:
  borelia:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Trusted-header auth: fine for a local/demo container. Before exposing this
      # on a network set BORELIA_ENV=prod, AUTH_MODE=jwt and AUTH_JWT_SECRET.
      - BORELIA_ENV=dev
      - BORELIA_ENABLE_DEMO_SEED=true
      # Keep the database and interpretation snapshots on the mounted volume.
      - BORELIA_DB_PATH=/app/backend/data/borelia.db
      - BORELIA_ARTIFACT_DIR=/app/backend/data/artifacts
    volumes:
      - borelia-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim has no curl; match the Dockerfile's urllib probe.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status < 500 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  borelia-data:
